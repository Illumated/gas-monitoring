# RINIR factory installation for Debian 13 amd64.
# WARNING: installation erases the first non-removable internal disk.

d-i debian-installer/locale string ru_RU.UTF-8
d-i keyboard-configuration/xkb-keymap select ru
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Moscow
d-i clock-setup/ntp boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string rinir-factory
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

d-i passwd/root-login boolean false
d-i passwd/make-user boolean false

d-i partman/early_command string \
  DISK=""; \
  for candidate in $(list-devices disk); do \
    block="${candidate#/dev/}"; \
    [ -r "/sys/block/$block/removable" ] || continue; \
    [ "$(cat "/sys/block/$block/removable")" = "0" ] || continue; \
    DISK="$candidate"; break; \
  done; \
  [ -n "$DISK" ] || exit 1; \
  debconf-set partman-auto/disk "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

apt-cdrom-setup apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/non-free-firmware boolean true
tasksel tasksel/first multiselect standard
d-i pkgsel/include string ca-certificates curl openssl apache2-utils nginx lightdm openbox chromium unclutter systemd-resolved nftables
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

d-i preseed/late_command string \
  mkdir -p /target/opt/rinir-factory; \
  cp -a /cdrom/factory/. /target/opt/rinir-factory/; \
  chmod 0700 /target/opt/rinir-factory/provision.sh; \
  cp /cdrom/factory/factory-provision.service /target/etc/systemd/system/; \
  ln -s /etc/systemd/system/factory-provision.service \
    /target/etc/systemd/system/multi-user.target.wants/factory-provision.service

d-i finish-install/reboot_in_progress note
