server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/gas-monitoring/tls/device.crt;
    ssl_certificate_key /etc/gas-monitoring/tls/device.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:18082/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /__auth;
        auth_request_set $authenticated_user $upstream_http_x_authenticated_user;
        proxy_pass http://127.0.0.1:1880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Authenticated-User $authenticated_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
