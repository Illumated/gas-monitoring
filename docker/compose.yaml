name: ${COMPOSE_PROJECT_NAME:-gas-monitoring}

services:
  influxdb:
    image: influxdb:2.7.12@sha256:b8d940ca9376f85118260f5b6bd236b8a00b1749c3350c5578d4cde8e27f31f2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?set INFLUXDB_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?set INFLUXDB_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?set INFLUXDB_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?set INFLUXDB_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-8760h}
    ports:
      - "127.0.0.1:${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  influx-retention:
    image: gas-monitoring-node-red:0.1.0
    restart: "no"
    entrypoint:
      - node
      - /opt/gas-monitoring/configure-influx-retention.cjs
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:?set INFLUXDB_ORG in .env}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?set INFLUXDB_BUCKET in .env}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
      INFLUXDB_RETENTION: ${INFLUXDB_RETENTION:-8760h}
    depends_on:
      influxdb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  node-red:
    build:
      context: ..
      dockerfile: docker/node-red/Dockerfile
    image: gas-monitoring-node-red:0.1.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Moscow}
      FLOWS: flows.json
      HOST_MACHINE_NAME: ${HOST_MACHINE_NAME:-RINIR-TEST01}
      HOST_HOSTNAME_FILE: /run/host-hostname
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?set NODE_RED_CREDENTIAL_SECRET in .env}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD_HASH: ${NODE_RED_ADMIN_PASSWORD_HASH:-}
      SERVICE_ACCESS_CODE: ${SERVICE_ACCESS_CODE:-}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:-}
      SERVICE_UNLOCK_MINUTES: ${SERVICE_UNLOCK_MINUTES:-15}
      AUTH_SERVICE_URL: http://auth-service:8082
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-development-auth-service-token-change-me}
      MODBUS_HOST: ${MODBUS_HOST:-192.168.50.10}
      MODBUS_PORT: ${MODBUS_PORT:-502}
      MODBUS_UNIT_ID: ${MODBUS_UNIT_ID:-65}
      VALVE_RELAY_UNIT_ID: ${VALVE_RELAY_UNIT_ID:-66}
      MODBUS_POLL_INTERVAL_MS: ${MODBUS_POLL_INTERVAL_MS:-1000}
      MODBUS_COMMAND_DELAY_MS: ${MODBUS_COMMAND_DELAY_MS:-100}
      GAS_STALE_TIMEOUT_MS: ${GAS_STALE_TIMEOUT_MS:-3000}
      GAS_HYSTERESIS_BAR: ${GAS_HYSTERESIS_BAR:-0.1}
      GAS_DISPLAY_MAX_BAR: ${GAS_DISPLAY_MAX_BAR:-8}
      OXYGEN_WARN_LOW_BAR: ${OXYGEN_WARN_LOW_BAR:-3.5}
      OXYGEN_OK_LOW_BAR: ${OXYGEN_OK_LOW_BAR:-4}
      OXYGEN_OK_HIGH_BAR: ${OXYGEN_OK_HIGH_BAR:-6}
      OXYGEN_WARN_HIGH_BAR: ${OXYGEN_WARN_HIGH_BAR:-6.5}
      AIR_WARN_LOW_BAR: ${AIR_WARN_LOW_BAR:-3.5}
      AIR_OK_LOW_BAR: ${AIR_OK_LOW_BAR:-4}
      AIR_OK_HIGH_BAR: ${AIR_OK_HIGH_BAR:-6}
      AIR_WARN_HIGH_BAR: ${AIR_WARN_HIGH_BAR:-6.5}
      N2O_WARN_LOW_BAR: ${N2O_WARN_LOW_BAR:-3.5}
      N2O_OK_LOW_BAR: ${N2O_OK_LOW_BAR:-4}
      N2O_OK_HIGH_BAR: ${N2O_OK_HIGH_BAR:-6}
      N2O_WARN_HIGH_BAR: ${N2O_WARN_HIGH_BAR:-6.5}
      MAX_NOTIFICATIONS_ENABLED: ${MAX_NOTIFICATIONS_ENABLED:-false}
      MAX_API_URL: ${MAX_API_URL:-https://platform-api2.max.ru}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_CHAT_ID: ${MAX_CHAT_ID:-}
      MAX_REMINDER_INTERVAL_MINUTES: ${MAX_REMINDER_INTERVAL_MINUTES:-30}
      MAX_RETRY_COUNT: ${MAX_RETRY_COUNT:-2}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:?set INFLUXDB_ORG in .env}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?set INFLUXDB_BUCKET in .env}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?set INFLUXDB_TOKEN in .env}
    ports:
      - "127.0.0.1:${NODE_RED_PORT:-1880}:1880"
    volumes:
      - node-red-data:/data
    depends_on:
      influx-retention:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const r=require('http').get('http://127.0.0.1:1880/',
          x=>process.exit(x.statusCode<500?0:1));
          r.on('error',()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  auth-service:
    image: gas-monitoring-node-red:0.1.0
    restart: unless-stopped
    entrypoint:
      - node
      - /opt/gas-monitoring/auth-service.cjs
    environment:
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:-development-auth-service-token-change-me}
      REMOTE_INITIAL_USER: ${REMOTE_INITIAL_USER:-operator}
      REMOTE_INITIAL_PASSWORD: ${REMOTE_INITIAL_PASSWORD:-development-remote-password}
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-18082}:8082"
    volumes:
      - auth-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const r=require('http').get('http://127.0.0.1:8082/health',
          x=>process.exit(x.statusCode===200?0:1));
          r.on('error',()=>process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  modbus-simulator:
    image: gas-monitoring-node-red:0.1.0
    profiles:
      - fat
    restart: unless-stopped
    entrypoint:
      - node
      - /opt/gas-monitoring/modbus-simulator.cjs
    environment:
      MODBUS_UNIT_ID: 65
      NODE_PATH: /usr/src/node-red/node_modules
    ports:
      - "127.0.0.1:${MODBUS_SIMULATOR_PORT:-1502}:502"
      - "127.0.0.1:${MODBUS_SIMULATOR_CONTROL_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const r=require('http').get('http://127.0.0.1:8080/health',
          x=>process.exit(x.statusCode===200?0:1));
          r.on('error',()=>process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  max-mock:
    image: gas-monitoring-node-red:0.1.0
    profiles:
      - fat
    restart: unless-stopped
    entrypoint:
      - node
      - /opt/gas-monitoring/max-mock.cjs
    ports:
      - "127.0.0.1:${MAX_MOCK_PORT:-18081}:8081"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const r=require('http').get('http://127.0.0.1:8081/health',
          x=>process.exit(x.statusCode===200?0:1));
          r.on('error',()=>process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  node-red-data:
  influxdb-data:
  influxdb-config:
  auth-data:
